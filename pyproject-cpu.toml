[project]
name = "brushcue-cpu"
version = "1.0.2"
description = "Python API for the BrushCue media editing platform (CPU-only build)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { file = "LICENSE" }
authors = [{ name = "Dito Technologies LLC" }]

[project.urls]
Homepage = "https://www.brushcue.com/docs/py"
Repository = "https://github.com/ditotechnologies/brushcue"
Documentation = "https://www.brushcue.com/docs/py"
"Bug Tracker" = "https://github.com/ditotechnologies/brushcue/issues"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../rust/matisse/py/Cargo.toml"
module-name = "brushcue._py"
